[workspace]
resolver = "2"
members = ["crates/guidy-core", "crates/guidy-i18n", "crates/guidy-app", "crates/guidy-llm", "xtask"]
default-members = ["crates/guidy-core", "crates/guidy-i18n", "crates/guidy-app", "crates/guidy-llm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Imran (https://imran.codes)"]
homepage = "https://guidy.imran.codes"
repository = "https://github.com/imran-vz/Guidy"

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
# Keep symbol names so macOS crash reports show Guidy frames.
strip = "debuginfo"
panic = "unwind"
