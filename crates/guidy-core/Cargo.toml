[package]
name = "guidy-core"
description = "Guidy backend: audio capture, transcription, models, history, settings, output"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "guidy_core"

[features]
default = []
# Exposes test helpers (recording event sink, temp app handle) to other crates.
test-support = []

[build-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
anyhow = "1.0.95"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
earshot = "1.2.2"
enigo = "0.6.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "flac", "mp3", "vorbis"] }
handy-recorder = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
whatlang = "0.16"
isolang = "2"
chrono = "0.4"
rusqlite_migration = "2.3"
sha2 = "0.10"
libc = "0.2"
transcribe-cpp = { version = "0.4.0", default-features = false, features = ["serde"] }
handy-keys = "0.3.4"
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = ["tokio"] }
# Replacements for the Tauri plugins the backend used.
arboard = { version = "3.6", features = ["image-data"] }
open = "5"
global-hotkey = "0.8"
tray-icon = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"
dirs = "6"
parking_lot = "0.12"
auto-launch = "0.5"
interprocess = "2"
# Meeting notes: Keychain secrets, voiceprints, encrypted audio.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
sherpa-onnx = "1.13.8"
chacha20poly1305 = "0.10"
rand = "0.9"
opus = "0.3"
base64 = "0.22"

# SQLCipher replaces plain bundled SQLite: unkeyed databases (history.db) stay
# plain SQLite, keyed ones (meetings.db) are encrypted. macOS uses
# CommonCrypto; other targets vendor OpenSSL.
[target.'cfg(target_os = "macos")'.dependencies.rusqlite]
version = "0.37"
features = ["bundled-sqlcipher"]

[target.'cfg(not(target_os = "macos"))'.dependencies.rusqlite]
version = "0.37"
features = ["bundled-sqlcipher-vendored-openssl"]

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.4.0", default-features = false, features = ["dynamic-backends", "vulkan"] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.4.0", default-features = false, features = ["metal"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3.2"
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon's Linux backend (libappindicator) needs a GTK main loop on the
# thread that owns the tray; GPUI doesn't run one, so the tray gets its own.
gtk = "0.18"
transcribe-cpp = { version = "0.4.0", default-features = false, features = ["dynamic-backends", "vulkan"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }
