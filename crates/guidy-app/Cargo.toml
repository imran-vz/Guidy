[package]
name = "guidy-app"
description = "Guidy: offline speech-to-text desktop app (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "guidy_app"
path = "src/lib.rs"

[[bin]]
name = "guidy"
path = "src/main.rs"

[dependencies]
guidy-core = { path = "../guidy-core" }
guidy-i18n = { path = "../guidy-i18n" }
gpui-kit = "=0.7.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
smol = "2"
rust-embed = "8"
regex = "1"
chrono = { version = "0.4", features = ["unstable-locales"] }
parking_lot = "0.12"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
anyhow = "1"
cargo-packager-updater = "0.2.3"
reqwest = { version = "0.12", features = ["json"] }
hound = "3.5"
raw-window-handle = "0.6"

[dev-dependencies]
guidy-core = { path = "../guidy-core", features = ["test-support"] }
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# `cargo packager --release -p guidy-app` (paths are relative to this file).
# Packages are unsigned: macOS gets an ad-hoc signature ("-") so the
# microphone entitlement applies, with no Developer ID or notarization.
[package.metadata.packager]
product-name = "Guidy"
identifier = "dev.guidy.app"
description = "Offline speech-to-text"
category = "Productivity"
copyright = "Copyright (c) 2026 Imran. Portions (c) 2025 CJ Pais (Handy)."
license-file = "../../LICENSE"
before-packaging-command = "cargo build --release -p guidy-app"
out-dir = "../../target/packages"
binaries-dir = "../../target/release"
binaries = [{ path = "guidy", main = true }]
icons = ["../../assets/icons/app/guidy.png", "../../assets/icons/app/guidy.icns", "../../assets/icons/app/guidy.ico"]
resources = [
  { src = "../../assets/resources", target = "resources" },
  # transcribe-cpp shared libs (Windows/Linux); empty on macOS.
  { src = "../guidy-core/transcribe-libs", target = "." },
]

[package.metadata.packager.macos]
minimum-system-version = "10.15"
info-plist-path = "../../assets/Info.plist"
entitlements = "../../assets/Entitlements.plist"
signing-identity = "-"

[package.metadata.packager.deb]
depends = ["libopenblas0", "libayatana-appindicator3-1", "libxkbcommon-x11-0", "libvulkan1"]

[package.metadata.packager.nsis]
appdata-paths = ["$LOCALAPPDATA/$IDENTIFIER"]
