[package]
name = "guidy-llm"
description = "Guidy's built-in llama.cpp worker (separate process: its ggml must not meet transcribe-cpp's)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "guidy-llm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["metal", "common"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common"] }
