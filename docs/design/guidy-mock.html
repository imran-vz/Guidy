<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guidy design mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────────── Tokens (mirror crates/guidy-app/src/ui/design.rs) ───────────── */
:root{
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,monospace;
  --t-display:30px; --t-headline:17px; --t-title:15px; --t-body:13px; --t-mono:12px; --t-eyebrow:10.5px;
  --sx:16px; --sy:14px; --well-inset:6px;
  --r-well:14px; --r-panel:12px; --r-chip:5px; --r-ctl:6px; --grid:24px;
}
.g[data-mode=dark]{
  --ink:#0d0d0d; --frame:#1b1b1b; --surface:#121212; --raised:#212121; --raised-2:#292929;
  --hair:#222; --input:#2e2e2e; --gridc:rgba(255,255,255,.05); --mark:rgba(255,255,255,.18);
  --line:#8a8a8a; --text:#ededed; --muted:#8b8b8b; --faint:#5f5f5f;
  --accent:#ffc72c; --accent-hover:#ffd355; --accent-text:#ffc72c; --accent-soft:rgba(255,199,44,.12);
  --on-accent:#121212; --rim:rgba(255,255,255,.12); --sheen:rgba(255,255,255,.07);
  --danger:#ff6b61; --success:#6fd08c;
  --desk:linear-gradient(180deg,#1d1d1d,#3a3a3a); --shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
}
.g[data-mode=light]{
  --ink:#fbfbfa; --frame:#efefec; --surface:#fff; --raised:#ebebe7; --raised-2:#e2e2de;
  --hair:#e5e5e1; --input:#d6d6d1; --gridc:rgba(0,0,0,.05); --mark:rgba(0,0,0,.16);
  --line:#8c8c86; --text:#161616; --muted:#6c6c67; --faint:#a3a39d;
  --accent:#ffc72c; --accent-hover:#ffd355; --accent-text:#a87500; --accent-soft:rgba(255,199,44,.2);
  --on-accent:#121212; --rim:#fff; --sheen:rgba(255,255,255,.55);
  --danger:#d6403a; --success:#2f9a58;
  --desk:linear-gradient(180deg,#e9e9e6,#d4d4cf); --shadow:0 30px 80px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.08);
}

/* ───────────── Mock chrome (not part of the app) ───────────── */
.g{font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased}
.g *{box-sizing:border-box}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-family:var(--sans)}
.ctrl button{font:500 12px var(--sans);padding:6px 11px;border-radius:999px;border:1px solid var(--border,#bbb);background:transparent;color:var(--foreground,#555);cursor:pointer}
.ctrl button.on{background:#ffc72c;color:#121212;border-color:#ffc72c}
.ctrl .sp{flex:1}
.desk{background:var(--desk);border-radius:var(--radius,12px);padding:28px 16px;display:flex;justify-content:center}

/* ───────────── Window shell ───────────── */
.win{width:100%;max-width:700px;height:600px;background:var(--frame);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.titlebar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:var(--t-body)}
.lights{display:flex;gap:8px;margin-right:10px}.lights i{width:12px;height:12px;border-radius:50%;background:var(--raised-2);display:block}
.titlebar .prod{font-weight:500}.titlebar .slash{color:var(--faint)}.titlebar .where{color:var(--muted)}
.titlebar svg{color:var(--accent-text)}
.body{flex:1;min-height:0;display:flex}
.side{width:168px;flex:none;padding:4px 8px;display:flex;flex-direction:column;gap:2px}
.nav{position:relative;display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:9px;font-size:var(--t-body);color:var(--muted);cursor:pointer;user-select:none}
.nav:hover{background:color-mix(in srgb,var(--raised) 55%,transparent);color:var(--text)}
.nav.on{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.nav.on svg{color:var(--accent-text)}
.well{flex:1;min-width:0;margin-right:var(--well-inset);background:var(--ink);border:1px solid var(--hair);border-radius:var(--r-well);overflow-y:auto;scrollbar-width:thin}
.well-in{padding:20px 20px 28px;display:flex;flex-direction:column;gap:22px}
.status{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;color:var(--muted)}
.status .ver{font:11px var(--mono);color:var(--faint)}
.status .sp{flex:1}
.status .model{display:flex;align-items:center;gap:7px;color:var(--text);cursor:pointer}

/* ───────────── Glass: rim light + sheen ───────────── */
.rim{position:relative}
.rim::before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;background:linear-gradient(90deg,transparent,var(--rim),transparent);pointer-events:none;z-index:2}
.sheen{position:relative;overflow:hidden}
.sheen::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-45%;background:linear-gradient(100deg,transparent,var(--sheen),transparent);animation:sweep 5.2s cubic-bezier(.2,.7,.2,1) infinite;pointer-events:none}
@keyframes sweep{0%{left:-45%}40%,100%{left:105%}}
.shimmer{background:linear-gradient(90deg,var(--muted) 0%,var(--muted) 35%,var(--text) 50%,var(--muted) 65%,var(--muted) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.2s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-150% 0}}
.g.still .sheen::after,.g.still .shimmer,.g.still .pulse,.g.still .wave i{animation:none!important}
.g.still .shimmer{color:var(--muted);background:none}

/* ───────────── Type ───────────── */
.eyebrow{font:var(--t-eyebrow)/14px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.mono{font:var(--t-mono)/1.4 var(--mono)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.acc{color:var(--accent-text)}
.h-page{display:flex;align-items:baseline;gap:8px;font-size:var(--t-headline);font-weight:500}
.h-page .crumb{font-size:var(--t-body);color:var(--muted);font-weight:400}
.h-page .crumb b{color:var(--faint);font-weight:400;margin-right:6px}
.lede{font-size:var(--t-body);color:var(--muted);line-height:1.55;margin-top:6px}
.headline{font-size:var(--t-headline);font-weight:500;letter-spacing:-.01em}

/* ───────────── Building blocks ───────────── */
.group{display:flex;flex-direction:column;gap:8px}
.group>.eyebrow{padding:0 2px;display:flex;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-panel);overflow:hidden}
.row{min-height:48px;padding:10px var(--sx);display:flex;align-items:center;gap:16px;justify-content:space-between;font-size:var(--t-body)}
.row+.row,.sec+.sec{border-top:1px solid var(--hair)}
.row .lbl{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .desc{font-size:12px;color:var(--muted)}
.sec{padding:var(--sy) var(--sx)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:var(--r-chip);font:11px/16px var(--mono);background:var(--raised);color:var(--muted);white-space:nowrap}
.chip.a{background:var(--accent-soft);color:var(--accent-text)}
.kbd{display:inline-flex;gap:4px}
.kbd span{font:11.5px/1 var(--mono);padding:6px 8px;border-radius:6px;background:var(--raised);border:1px solid var(--input);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.select{min-width:180px;height:30px;padding:0 10px;border-radius:var(--r-ctl);border:1px solid var(--input);display:flex;align-items:center;justify-content:space-between;font-size:var(--t-body);background:var(--surface)}
.select svg{color:var(--muted)}
.sw{width:32px;height:18px;border-radius:999px;background:var(--raised-2);position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#f5f5f5;transition:.15s}
.sw.on{background:var(--accent)}.sw.on::after{left:16px;background:#121212}
.btn{height:30px;padding:0 14px;border-radius:999px;border:0;font:500 var(--t-body) var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn.p{background:var(--accent);color:var(--on-accent)}.btn.p:hover{background:var(--accent-hover)}
.btn.s{background:var(--raised);color:var(--text)}.btn.s:hover{background:var(--raised-2)}
.btn.sm{height:26px;padding:0 11px;font-size:12px}
.ib{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--raised);color:var(--text)}
.reset{color:var(--faint)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--sx);border-top:1px solid var(--hair)}
.stats{display:grid;border-top:1px solid var(--hair)}
.stats>div{padding:12px var(--sx);display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.stats.c3>div:nth-child(3n),.stats.c4>div:nth-child(4n){border-right:0}
.stats.c3{grid-template-columns:repeat(3,1fr)}.stats.c4{grid-template-columns:repeat(4,1fr)}
.stats .mono{color:var(--text)}
.stats.nob>div:nth-last-child(-n+3){border-bottom:0}
.stats.c4.nob>div:nth-last-child(-n+4){border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dot.idle{background:transparent}.dot.idle::after{background:var(--faint)}
.pulse::after{animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.bar{height:4px;border-radius:999px;background:var(--raised);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.pips{display:inline-flex;gap:3px}.pips i{width:10px;height:4px;border-radius:2px;background:var(--raised-2)}.pips i.f{background:var(--text)}
.kv{display:flex;align-items:center;justify-content:space-between;padding:11px var(--sx);font:var(--t-mono)/1.4 var(--mono)}
.kv+.kv{border-top:1px solid var(--hair)}
.kv .r{display:flex;gap:18px;color:var(--muted)}
.kv.a,.kv.a .r{color:var(--accent-text)}

/* ───────────── Blueprint stage ───────────── */
.bp{position:relative;overflow:hidden;background:var(--ink);
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);
  background-size:var(--grid) var(--grid);background-position:center center}
.bp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(transparent,var(--ink));pointer-events:none}
.bp .x{position:absolute;width:10px;height:10px;color:var(--mark)}
.bp .x::before,.bp .x::after{content:"";position:absolute;background:currentColor}
.bp .x::before{left:0;right:0;top:4.5px;height:1px}.bp .x::after{top:0;bottom:0;left:4.5px;width:1px}
.la{stroke:var(--line);fill:none;stroke-width:1.2}
.ld{stroke:var(--mark);fill:none;stroke-width:1;stroke-dasharray:3 3}
.lx{stroke:var(--accent-text);fill:none;stroke-width:1.4}
.lf{fill:var(--accent-soft);stroke:none}
.lfill{fill:var(--surface)}
.svg-t{font:12px var(--mono);fill:var(--muted)}
.svg-t.a{fill:var(--accent-text)}

/* ───────────── Page specifics ───────────── */
.hist-head{display:flex;align-items:center;justify-content:space-between;padding:12px var(--sx) 0}
.hist-text{padding:8px var(--sx) 12px;font-size:var(--t-body);line-height:1.6}
.player{display:flex;align-items:center;gap:10px;padding:10px var(--sx);border-top:1px solid var(--hair)}
.player .bar{flex:1}
.mrow{display:flex;align-items:center;gap:12px;padding:12px var(--sx);font-size:var(--t-body);cursor:pointer}
.mrow+.mrow{border-top:1px solid var(--hair)}
.mrow:hover{background:color-mix(in srgb,var(--raised) 35%,transparent)}
.mrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.seg{display:inline-flex;padding:3px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;gap:2px}
.seg span{padding:5px 14px;border-radius:999px;font-size:12px;color:var(--muted);cursor:pointer}
.seg span.on{background:var(--raised);color:var(--text)}
.talk{padding:6px var(--sx) 14px}
.talk .tr{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:12px;height:30px;font-size:12.5px}
.talk .lane{position:relative;height:14px}
.talk .lane::before{content:"";position:absolute;left:0;right:0;top:6.5px;height:1px;background:var(--hair)}
.talk .seg-b{position:absolute;top:3px;height:8px;border-radius:2px;background:var(--line);opacity:.7}
.talk .tr.a .seg-b{background:var(--accent);opacity:1}
.talk .axis{display:grid;grid-template-columns:76px 1fr 44px;gap:12px;margin-top:6px}
.talk .axis div{display:flex;justify-content:space-between}
.blk{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:10px var(--sx);font-size:var(--t-body);line-height:1.6}
.blk+.blk{border-top:1px solid var(--hair)}
.blk .who{display:flex;flex-direction:column;gap:2px}
.mcard{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px var(--sx)}
.mcard+.mcard{border-top:1px solid var(--hair)}
.mcard .nm{display:flex;gap:8px;align-items:center;font-size:var(--t-body);font-weight:500}
.mcard .meta{display:flex;gap:14px;margin-top:5px;align-items:center}
.ob{display:flex;flex-direction:column;height:100%}
.ovl-stage{border-radius:var(--r-panel);height:250px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:20px}
.pill{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(20px);border:1px solid var(--hair);border-radius:999px;height:40px;display:flex;align-items:center;gap:12px;padding:0 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.wave{display:flex;gap:3px;align-items:center;height:18px}
.wave i{width:3px;border-radius:2px;background:var(--text);animation:wv 1s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.45)}}
.live{width:392px;max-width:100%;border-radius:16px;height:auto;flex-direction:column;align-items:stretch;padding:0}
.live .txt{padding:10px 14px 0;font-size:15px;line-height:1.45}
.live .rowp{height:40px;display:flex;align-items:center;gap:12px;padding:0 12px}
.screen{display:none}.screen.on{display:flex}
.note{font:12px/1.5 var(--sans);color:var(--muted-foreground,#999);margin-top:10px}
</style>
</head>
<body>
<div class="g" id="g" data-mode="dark">
  <div class="ctrl" id="ctrl">
    <button data-s="general" class="on">General</button>
    <button data-s="history">History</button>
    <button data-s="meetings">Meetings</button>
    <button data-s="meeting">Meeting detail</button>
    <button data-s="models">Models</button>
    <button data-s="about">About</button>
    <button data-s="onboarding">Onboarding</button>
    <button data-s="overlay">Overlay</button>
    <span class="sp"></span>
    <button id="mode">Light</button>
    <button id="motion">Motion on</button>
  </div>

  <div class="desk">
  <div class="win" id="win">
    <div class="titlebar">
      <div class="lights"><i></i><i></i><i></i></div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/></svg>
      <span class="prod">Guidy</span><span class="slash" id="slash">/</span><span class="where" id="where">General</span>
    </div>
    <div class="body" id="appbody">
      <div class="side" id="side"></div>
      <div class="well" id="well"><div class="well-in" id="page"></div></div>
    </div>
    <div class="status" id="status">
      <span class="model"><span class="dot"></span>Nemotron Streaming 3.5</span>
      <span class="faint">·</span><span>Ready</span>
      <span class="sp"></span><span>Update checks off</span><span class="faint">·</span><span class="ver">v0.1.0</span>
    </div>
  </div>
  </div>
  <div class="note">Mock only: tokens match <code>ui/design.rs</code> and <code>themes/guidy.json</code>. The sidebar and the tabs above both switch screens.</div>
</div>

<script>
const I = {
  mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  note:'<path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4M2 10h4M2 14h4M2 18h4"/><path d="M21.4 5.6a2 2 0 1 0-2.8-2.8l-5.4 5.4-.9 3.7 3.7-.9Z"/>',
  cpu:'<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  spark:'<path d="M9.9 15.5A2 2 0 0 0 8.5 14l-6.1-1.6a.5.5 0 0 1 0-1L8.5 10A2 2 0 0 0 10 8.5l1.6-6.1a.5.5 0 0 1 1 0L14 8.5a2 2 0 0 0 1.5 1.5l6.1 1.6a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.5 1.5l-1.6 6.1a.5.5 0 0 1-1 0Z"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  reset:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  copy:'<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1Z"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  play:'<path d="M6 3l14 9-14 9Z"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  dl:'<path d="M12 15V3M7 10l5 5 5-5M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
  folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  rec:'<circle cx="12" cy="12" r="6"/>',
};
const ic=(n,s=15)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const info=`<span class="faint" style="display:inline-flex;vertical-align:-2px;margin-left:4px">${ic('info',12)}</span>`;
const sel=v=>`<div class="select">${v}${ic('chev',14)}</div>`;
const reset=`<span class="ib reset">${ic('reset',13)}</span>`;
const row=(title,ctl,desc)=>`<div class="row"><div class="lbl"><div>${title}${desc?'':info}</div>${desc?`<div class="desc">${desc}</div>`:''}</div><div style="display:flex;align-items:center;gap:6px">${ctl}</div></div>`;
const group=(t,rows,right='')=>`<div class="group"><div class="eyebrow"><span>${t}</span><span>${right}</span></div><div class="panel rim">${rows.join('')}</div></div>`;
const X=()=>`<i class="x" style="left:44px;top:44px"></i><i class="x" style="right:44px;top:44px"></i><i class="x" style="left:44px;bottom:44px"></i><i class="x" style="right:44px;bottom:44px"></i>`;

const NAV=[['general','General','mic'],['history','History','clock'],['meetings','Meetings','note'],['models','Models','cpu'],['advanced','Advanced','cog'],['post','Post Process','spark'],['about','About','info']];

const P={};
P.general=()=>`
  ${group('Shortcuts',[

P.history=()=>`

    <div><div class="h-page">History <span class="crumb"><b>/</b>128 transcriptions · 3 saved</span></div></div>
    <button class="btn s sm">${ic('folder',13)}Open folder</button>
  </div>
  ${entry('Today · 14:32','Let’s move the design review to Thursday and loop in the platform team so they can sign off on the new token pipeline before we ship.',true,0.42,'0:07','0:16')}
  <div class="panel rim">
    <div class="hist-head"><span class="eyebrow">Today · 14:35</span><span class="chip a"><span class="shimmer">Transcribing…</span></span></div>
    <div class="hist-text"><div class="bar sheen" style="height:8px;width:72%;background:var(--raised)"></div><div class="bar sheen" style="height:8px;width:48%;margin-top:9px;background:var(--raised)"></div></div>
  </div>
  ${entry('Yesterday · 18:04','Reminder to send Priya the updated onboarding copy and the two microphone permission screenshots.',false,0,'0:00','0:09')}

function entry(when,text,saved,f,a,b){return `<div class="panel rim">
  <div class="hist-head"><span class="eyebrow">${when}</span><span style="display:flex;gap:2px">
    <span class="ib">${ic('copy',13)}</span><span class="ib" style="${saved?'color:var(--accent-text)':''}">${ic('star',13)}</span><span class="ib">${ic('reset',13)}</span><span class="ib">${ic('trash',13)}</span></span></div>
  <div class="hist-text">${text}</div>
  <div class="player"><span class="ib" style="color:var(--text)">${ic('play',12)}</span><span class="mono muted">${a}</span><div class="bar"><i style="width:${f*100}%"></i></div><span class="mono muted">${b}</span></div>
</div>`}

P.meeting=()=>{
  const sp=[['You',true,[[2,9],[22,6],[40,14],[71,8]],'31%'],['Priya',false,[[11,10],[30,9],[58,12]],'28%'],['Marcus',false,[[0,2],[54,4],[80,15]],'22%'],['Lena',false,[[17,4],[86,10]],'19%']];
  return `
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:-8px" class="muted"><span style="display:inline-flex">${ic('back',14)}</span><span style="font-size:12px">All meetings</span></div>
  <div class="panel rim">
    <div class="sec">
      <div class="h-page" style="font-size:var(--t-title)">Weekly product sync <span class="crumb"><b>/</b>Today · 10:00</span></div>
    </div>
    <div class="stats c4 nob">
      <div><span class="eyebrow">Duration</span><span class="mono">42:18</span></div>
      <div><span class="eyebrow">Speakers</span><span class="mono">4</span></div>
      <div><span class="eyebrow">Words</span><span class="mono">6,412</span></div>
      <div><span class="eyebrow">You spoke</span><span class="mono acc">31%</span></div>
    </div>
    <div class="sec" style="border-top:1px solid var(--hair);padding-bottom:4px;display:flex;justify-content:space-between"><span class="eyebrow">Talk time</span><span class="eyebrow">Share</span></div>
    <div class="talk">
      ${sp.map(([n,a,segs,pct])=>`<div class="tr ${a?'a':''}"><span class="${a?'acc':''}">${n}</span><div class="lane">${segs.map(([l,w])=>`<i class="seg-b" style="left:${l}%;width:${w}%"></i>`).join('')}</div><span class="mono ${a?'acc':'muted'}" style="text-align:right">${pct}</span></div>`).join('')}
      <div class="axis"><span class="eyebrow">Min</span><div class="eyebrow"><span>0</span><span>10</span><span>20</span><span>30</span><span>42</span></div><span></span></div>
    </div>
    <div class="foot"><span class="eyebrow">Summary · local model</span><div style="display:flex;gap:8px"><button class="btn s sm">Tickets</button><button class="btn p sm">Summarize</button></div></div>
  </div>
  ${group('Transcript',[
    `<div class="blk"><div class="who"><span class="acc">You</span><span class="mono faint">00:12</span></div><div>Okay, quick one today. Main thing is the onboarding rewrite, and whether we can ship the new model picker this week.</div></div>`,
    `<div class="blk"><div class="who"><span>Priya</span><span class="mono faint">00:31</span></div><div>The picker's done on my side. The open question is the default. I'd recommend the streaming model for anyone on Apple silicon.</div></div>`,
    `<div class="blk"><div class="who"><span>Marcus</span><span class="mono faint">01:05</span></div><div>Agreed. We just need a fallback for older Intel machines, otherwise first-run is going to feel slow.</div></div>`,
  ])}`};

const g=document.getElementById('g');
let cur='general';
function go(s){
  cur=s;
  const full=s==='onboarding';
  document.getElementById('side').style.display=full?'none':'flex';
  document.getElementById('status').style.display=full?'none':'flex';
  document.getElementById('well').style.marginRight=full?'0':'';
  document.getElementById('well').style.border=full?'0':'';
  document.getElementById('well').style.borderRadius=full?'0':'';
  document.getElementById('appbody').style.padding=full?'0 6px 6px':'';
  const navId=s==='meeting'?'meetings':s==='overlay'?'general':s;
  document.getElementById('side').innerHTML=NAV.map(([id,l,i])=>`<div class="nav ${id===navId?'on rim':''}" onclick="go('${id}')">${ic(i)}<span>${l}</span></div>`).join('');
  const lbl={general:'General',history:'History',meetings:'Meetings',meeting:'Meetings',models:'Models',about:'About',onboarding:'Welcome',overlay:'Overlay',advanced:'Advanced',post:'Post Process'}[s];
  document.getElementById('where').textContent=lbl;
  document.getElementById('page').innerHTML=P[s]();
  document.getElementById('page').style.height=full?'100%':'';
  document.getElementById('well').scrollTop=0;
  document.querySelectorAll('#ctrl [data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
}
document.querySelectorAll('#ctrl [data-s]').forEach(b=>b.onclick=()=>go(b.dataset.s));
document.getElementById('mode').onclick=e=>{const d=g.dataset.mode==='dark';g.dataset.mode=d?'light':'dark';e.target.textContent=d?'Dark':'Light'};
document.getElementById('motion').onclick=e=>{g.classList.toggle('still');e.target.textContent=g.classList.contains('still')?'Motion off':'Motion on'};
const q=new URLSearchParams(location.search);
if(q.get('mode'))g.dataset.mode=q.get('mode');
go(q.get('s')||'general');
</script>
