name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # macOS only for now: Windows and Linux builds come back once there are
  # machines to test them on (CI alone isn't enough to fix platform code).
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      # Unit, UI (headless GPUI test platform) and CLI tests, then the
      # parity check (tests, commands, events, PARITY.md rows).
      - run: cargo xtask gate

  package:
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked
      # Unsigned packages. Code signing and notarization are not set up.
      - run: cargo packager --release -p guidy-app --formats app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: guidy-macos
          path: target/packages/*
